<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} {% endblock %}</title>
    <link rel="stylesheet" href=" ">
</head>
<body>

    {% include 'clientes/partials/_menu.html' %}

    <main>
        <div class="container">
            {% block main %}
            {% endblock %}
        </div>        
    </main>

    <footer>
        <p> Turma de 2026-2</p>
    </footer>



</body>
</html>

<style>

    body{
        margin: 0;
        background-color: lightgray;
        color: #222222;
    }       

    nav{
        height: 75px;
        background-color: #222222;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0px 6px 6px rgb(0,0,0,.3);
        
    }

    nav a{
        height: 75px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-family: cursive;
        font-size: 25px;
        text-decoration: none;
        padding: 0 30px;
    }

    nav a:hover{
        background-color: brown;
        
    }

    .container{
        margin-left: auto;
        margin-right: auto;
        margin-top: 100px;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: beige;
        border-radius: 8px;
        width: 500px;
        justify-content: center;
        box-shadow:0 15px 35px rgba(0,0,0,.3);
        
    }

    footer{
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        min-height: 50px;
        background-color: #222222;
        color: white;
        font-family: cursive;
        margin-top: 500px;
    }


</style>
